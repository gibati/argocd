apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-teste
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-teste
  template:
    metadata:
      labels:
        app: nginx-teste
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-teste
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: nginx-teste
  ports:
    - port: 80
      targetPort: 80
